<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceintures de maths 5e</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7ECF2;--paper:#FFFFFF;--ink:#1C2A39;--ink2:#4D5D6E;--line:#C9D6E4;--blue:#1F4FA8;--blue-soft:#E3EBF8;
  --red:#C42B2B;--green:#12875A;--green-soft:#E1F3E9;--yellow:#E9A800;--yellow-soft:#FFF4D1;--shade:#B9C3CD;--shade2:#D6DCE3;
  --track:#E2E7ED;--red-soft:#FBE4E2;--c1:#6C9BF0;--c2:#4CC184;--seyes:#D7E4F2;--seyes2:#A9C2E2;--marge:#E7A3A3;--mount:#F7E2A6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111922;--paper:#1A2531;--ink:#E7EEF6;--ink2:#A9B6C4;--line:#33475B;--blue:#86ABF5;--blue-soft:#22324A;
  --red:#FF8078;--green:#4CCB8E;--green-soft:#183A2B;--yellow:#F4C744;--yellow-soft:#3A3115;--shade:#5C6B7A;--shade2:#2A3846;
  --track:#2A3846;--red-soft:#3D1F1E;--c1:#3E6CC4;--c2:#2D9A62;--seyes:#22303E;--seyes2:#2E4258;--marge:#6E3A3A;--mount:#5A4C24;color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.1rem;margin-top:1.4em}
a{color:var(--blue)}
code{background:var(--blue-soft);padding:.05em .35em;border-radius:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1.2rem;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem}
.brand .belt{width:34px}
#topRight{display:flex;align-items:center;gap:.6rem}
.who{font-weight:700}
.prof-btn{background:none;border:1px solid transparent;color:var(--ink2);font:inherit;font-size:.8rem;opacity:.55;cursor:pointer;padding:.2rem .5rem;border-radius:6px}
.prof-btn:hover,.prof-btn:focus-visible{opacity:1;border-color:var(--line)}
main{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 4rem}
.sheet{background:var(--paper);border-radius:10px;padding:1.6rem;border:1px solid var(--line)}
.narrow{max-width:460px;margin:2rem auto}
.wide{margin-top:0;border-top-left-radius:0}
.lead{color:var(--ink2);margin-top:-.2em}
.hint{color:var(--ink2);font-size:.92rem}
.small{font-size:.86rem;color:var(--ink2)}
.empty{color:var(--ink2);font-style:italic}
.stack{display:flex;flex-direction:column;gap:.45rem}
.stack label{font-weight:700;margin-top:.4rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:7px;padding:.45rem .6rem}
textarea{width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pwd{display:flex;gap:.4rem;align-items:center}.pwd input{flex:1;min-width:0}
#lgPwd{font-size:1.25rem;letter-spacing:.06em}
.eye{font:inherit;font-size:.85rem;background:none;border:2px solid var(--line);border-radius:7px;padding:.45rem .6rem;color:var(--ink);cursor:pointer}
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0D1622}}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.ghost{background:none}
.btn.big{font-size:1.1rem;padding:.7rem 1.4rem}
.btn.small{font-size:.85rem;padding:.25rem .6rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.7rem 0;align-items:center}.btnrow.end{justify-content:flex-end}
.tag{display:inline-block;font-size:.85rem;font-weight:700;padding:.08rem .55rem;border-radius:99px}
.tag.ok{background:var(--green-soft);color:var(--green)}.tag.go{background:var(--yellow-soft);color:color-mix(in srgb,var(--yellow) 55%,var(--ink))}
.tag.lock{background:var(--shade2);color:var(--ink2)}.tag.soon{background:var(--blue-soft);color:var(--blue)}
.note{background:var(--blue-soft);padding:.6rem .9rem;border-radius:8px}.note.warn{background:var(--yellow-soft)}
/* connexion */
.login{text-align:left}
.login-belts{display:flex;gap:2px;margin-bottom:1rem}
.login-belts .belt{width:13%}
.login h1{font-size:2.3rem;letter-spacing:-.01em}
/* accueil */
.home-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:1rem;justify-content:space-between}
.domgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:1rem}
@media (max-width:900px){.domgrid{grid-template-columns:1fr}}
.domcol h2{padding-bottom:.4rem;border-bottom:3px solid var(--ink)}
.belts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.35rem}
.beltrow{padding:.35rem .5rem;border-radius:8px}
.beltrow-head{display:flex;align-items:center;gap:.7rem}
.bname{font-weight:700}
.beltrow.locked{opacity:.5}
.beltrow.current{background:var(--paper);border:2px solid var(--ink);padding:.8rem;margin:.4rem 0}
.curbox{display:flex;gap:1rem;align-items:center;margin:.6rem 0}
.beltrow .btn{width:100%;justify-content:center}
.links{margin:.3rem 0 0 3.4rem;padding:0;list-style:none;font-size:.92rem}
.links li::before{content:"↗ ";color:var(--ink2)}
/* notions et anneau */
.notions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem;flex:1;min-width:0}
.nrow{display:grid;grid-template-columns:1fr 3.4em;grid-template-areas:"name pct" "bar bar";gap:.1rem .4rem;font-size:.9rem}
.nname{grid-area:name;line-height:1.25}.npct{grid-area:pct;text-align:right;font-weight:700}
.nbar{grid-area:bar;height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.nbar span{display:block;height:100%;background:var(--yellow);border-radius:4px}
.nbar span.g{background:var(--green)}.nrow.ok .npct{color:var(--green)}
.notions.small .nrow{font-size:.82rem}
.ring-track{stroke:var(--track)}.ring-go{stroke:var(--yellow)}.ring-ok{stroke:var(--green)}
.ring-validbg{fill:var(--green-soft)}.ring-check{stroke:var(--green)}
.ring-big{fill:var(--ink);font-weight:700}.ring-small{fill:var(--ink2)}
/* exerciseur */
.exhead{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;margin-bottom:1rem}
.exhead h1{font-size:1.5rem;margin:0;flex:1}
.exgrid{display:grid;grid-template-columns:270px 1fr;gap:1.4rem;align-items:start}
@media (max-width:820px){.exgrid{grid-template-columns:1fr}.exside{order:2}}
.exside{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem}
.exside .ring{display:flex;justify-content:center;margin-bottom:.8rem}
.copie{padding:1.4rem 1.6rem 1.6rem;min-height:300px}
.qhead{display:flex;justify-content:space-between;gap:1rem;margin-bottom:.8rem;font-size:.9rem;color:var(--ink2)}
.qnotion{font-weight:700;color:var(--blue)}
.qbody{font-size:1.15rem;line-height:1.9}
.calc{font-size:1.25rem;font-weight:700;white-space:nowrap}
div.calc{margin:.6rem 0}
.phrase{margin:.6rem 0;padding:.4rem .8rem;border-left:4px solid var(--blue);background:color-mix(in srgb,var(--paper) 85%,transparent)}
.aide{font-size:.85rem;color:var(--ink2);line-height:1.4}
.fig{display:block;margin:.8rem 0;color:var(--ink);background:var(--paper);border-radius:6px}
.prog{display:flex;width:fit-content;flex-direction:column;margin:.6rem 0 .8rem;padding:.4rem 1rem;border:2px solid var(--ink);border-radius:8px;background:var(--paper);line-height:1.6}
.prog div::before{content:"• "}
.ansline{margin-top:.6rem}
.f{font-size:1.1rem;vertical-align:middle}
.f-num{width:5.2em;text-align:center}
.f-wide{width:min(100%,18em)}
select.f{padding:.3rem .4rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.fr.fin{position:relative;gap:9px;padding:2px 0}
.fr.fin input{width:3.4em}
.fr.fin::before{content:"";position:absolute;left:-3px;right:-3px;top:50%;border-top:2.5px solid var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.opt{font:inherit;font-size:1.05rem;padding:.45rem .9rem;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;min-width:3em}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.opt.on{color:#0D1622}}
.choices.multi .opt.on::before{content:"✓ "}
.order .pool,.order .seq{display:flex;flex-wrap:wrap;gap:.4rem;min-height:2.6rem;padding:.3rem;border-radius:8px}
.order .seq{border:2px dashed var(--line)}
.seqlabel{font-size:.85rem;color:var(--ink2);margin-top:.4rem}
.chip{font:inherit;font-weight:700;padding:.3rem .8rem;border-radius:99px;border:2px solid var(--blue);background:var(--paper);color:var(--blue);cursor:pointer}
.order .seq .chip{background:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.order .seq .chip{color:#0D1622}}
.keypad{display:flex;gap:.35rem;margin:.8rem 0 .2rem}
.key{font:inherit;font-weight:700;width:2.4em;height:2.2em;border:2px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);cursor:pointer}
.qmsg{margin-top:.8rem;line-height:1.5;font-size:1.02rem}
.qmsg.warn{padding:.5rem .8rem;background:var(--yellow-soft);border-radius:8px}
.qmsg.good,.qmsg.bad{padding:.6rem .9rem;border-radius:8px;background:var(--paper);border:2px solid}
.qmsg.good{border-color:var(--green)}.qmsg.bad{border-color:var(--red)}
.verdict{font-weight:700;font-size:1.15rem}
.qmsg.good .verdict{color:var(--green)}.qmsg.bad .verdict{color:var(--red)}
.qmsg.bad .corr{color:var(--red)}
.corr{margin-top:.2rem}
.qactions{margin-top:1rem}
input:disabled,select:disabled{opacity:1;background:var(--bg)}
.congrats{text-align:center}.congrats .belt{width:150px;margin:0 auto}.congrats h2{font-size:1.6rem}
/* prof */
.tabs{display:flex;flex-wrap:wrap;gap:.2rem}
.tab{font:inherit;font-weight:700;padding:.6rem 1rem;border:1px solid transparent;border-bottom:none;background:none;color:var(--ink2);cursor:pointer;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:.4rem}
.tab.on{background:var(--paper);border-color:var(--line);color:var(--ink);position:relative;top:1px}
.dot{width:.6em;height:.6em;border-radius:50%;background:var(--shade)}.dot.on{background:var(--green)}
.row-form{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-end;margin:.6rem 0}
.row-form label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;gap:.2rem}
.row-form label.check{flex-direction:row;align-items:center;gap:.4rem;padding-bottom:.6rem}
.row-form .grow{flex:1;min-width:12em}
.tablewrap{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;width:100%}
th,td{padding:.35rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:.85rem;color:var(--ink2)}
td input:not([type=checkbox]){width:100%;min-width:7em;padding:.3rem .45rem}
td.c{text-align:center}
.notes th[scope=row]{white-space:nowrap}
.cellbtn{font:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:.3rem .4rem;cursor:pointer;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:.15rem}
.cellbtn:hover{border-color:var(--line)}
.chips{display:flex;gap:3px}
.chip-belt{width:16px;height:16px;border-radius:4px;border:2px solid var(--shade);background:transparent}
.chip-belt.v{background:var(--bc);border-color:color-mix(in srgb,var(--bc) 70%,#000)}
.chip-belt.c{border-color:var(--ink);border-width:2.5px;background:repeating-linear-gradient(45deg,var(--bc) 0 3px,transparent 3px 6px)}
.detlist{list-style:none;padding:0;margin:0}
.detrow{display:flex;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:0}
.inl{font-size:.85rem;display:inline-flex;align-items:center;gap:.3rem}
.inl input{width:3.5em;padding:.2rem .3rem}
.exodom{margin-bottom:1.5rem}
.exobelt{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.exobelt.off{opacity:.6}
.nedit{margin:.3rem 0;padding-left:1.4rem;display:grid;grid-template-columns:repeat(2,1fr);gap:.3rem 1.4rem}
@media (max-width:700px){.nedit{grid-template-columns:1fr}}
.nedit input{width:100%;padding:.25rem .45rem;font-size:.92rem}
.exq{border:1px solid var(--line);border-radius:8px;padding:.7rem;margin:.5rem 0}
.exa{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--line);color:var(--green)}
.exa .corr{color:var(--ink2);font-size:.92rem}
.trou{display:inline-block;min-width:2.5em;border-bottom:2px dotted var(--ink2);text-align:center;color:transparent}
.linklist{list-style:none;padding:0}.linklist>li{padding:.5rem 0;border-bottom:1px solid var(--line)}.linklist .belt{vertical-align:middle;margin-right:.4rem}
.linklist ul{margin:.3rem 0 0 2.6rem;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3rem}
.switchbox{padding:1.2rem;border-radius:10px;border:2px solid var(--line);margin:1rem 0}
.switchbox.on{border-color:var(--green);background:var(--green-soft)}
.switchbox .big{font-size:1.25rem;font-weight:700;margin-top:0}
.narrowform{max-width:380px}
/* modale, notifications */
#modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:3vh 1rem;overflow-y:auto;z-index:20}
#modal[hidden]{display:none}
.modal-box{background:var(--paper);color:var(--ink);border-radius:12px;padding:1.5rem;max-width:760px;width:100%}
#toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;z-index:30;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;font-weight:700}
.toast.err{background:var(--red);color:#fff}
/* figures SVG */
.sv-shade{fill:var(--shade)}.sv-paper{fill:var(--paper)}.sv-bg{fill:var(--paper)}
.sv-red{stroke:var(--red);fill:none}.sv-blue{stroke:var(--blue)}.sv-bluet{fill:var(--blue)}
.sv-grid{stroke:var(--line)}.sv-pin{fill:#E8731A}.sv-pin2{fill:#E8731A;opacity:.35}.sv-pintext{fill:#fff}
.sv-thermo{fill:#D64541}.sv-under{fill:var(--shade2)}.sv-win{fill:#9CC3E6}.sv-ground{stroke:#8A6A44}.sv-mount{fill:var(--mount)}
@media (prefers-reduced-motion:no-preference){.ring path{transition:d .4s}}
@media (max-width:600px){main{padding:1rem .6rem 3rem}.sheet{padding:1.1rem}.copie{padding:1rem .9rem 1.2rem}.calc{white-space:normal}}

/* correction partie par partie */
.f.f-ok,input.f-ok:disabled,select.f-ok:disabled{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.f.f-ko,input.f-ko:disabled,select.f-ko:disabled{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700;text-decoration:line-through}
.seq.f-ok{border-color:var(--green);background:var(--green-soft)}.seq.f-ko{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default;opacity:1}
.opt.m-ok{background:var(--green);border-color:var(--green);color:#fff}
.opt.m-ko{background:var(--red);border-color:var(--red);color:#fff;text-decoration:line-through}
.opt.m-miss{background:var(--green-soft);border-color:var(--green);border-style:dashed;color:var(--green)}
.opt.m-no{opacity:.55}
.sv-c1{fill:var(--c1)}.sv-c2{fill:var(--c2)}.sv-dot{fill:var(--blue)}.sv-redt{fill:var(--red)}.sv-tree{fill:#3E9B4F}.sv-trunk{fill:#8A6A44}

.steps .calc{margin:.15rem 0}
.progwrap{display:flex;flex-wrap:wrap;gap:1.2rem 2rem;align-items:flex-start;margin:.6rem 0}
.progwrap .prog{margin:0}
.progsteps{display:flex;flex-direction:column;gap:.5rem;font-size:1.15rem}
.progsteps .f-wide{width:8em}

.t0{color:#1F4FA8;font-weight:700}.t1{color:#12875A;font-weight:700}.t2{background:#FFE66B;color:#1C2A39;font-weight:700;padding:0 .15em;border-radius:3px}.t3{color:#7E3AA8;font-weight:700}
@media (prefers-color-scheme:dark){.t0{color:#86ABF5}.t1{color:#4CCB8E}.t2{background:#6B5A12;color:#FFF3B0}.t3{color:#C99BEB}}
table.mini{width:auto;margin:.5rem 0;font-size:.95rem}table.mini th,table.mini td{border:1px solid var(--line);padding:.25rem .7rem;text-align:center}
.pair{display:flex;flex-wrap:wrap;gap:0 1.5rem}

.cex{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;margin:.5rem 0;line-height:1.55}
.cex>div{min-width:12em}

details.import{margin:.8rem 0;padding:.6rem .9rem;border:1px solid var(--line);border-radius:8px}details.import summary{cursor:pointer;font-weight:700}

</style>
</head>
<body>
<header class="topbar"><div class="brand"><svg class="belt" viewBox="0 0 80 44" aria-hidden="true"><rect x="2" y="12" width="76" height="11" rx="2.5" fill="#1C1C1C"/><path d="M36,20 L27,41 L35,41 L40,29 L45,41 L53,41 L44,20Z" fill="#1C1C1C"/><rect x="33" y="8.5" width="14" height="18" rx="3" fill="#1C1C1C"/></svg>Ceintures de maths 5e</div><div id="topRight"></div></header>
<main id="main"><p style="text-align:center;margin-top:3rem">Chargement…</p></main>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>
// ================= OUTILS =================
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const P = arr => arr[Math.floor(Math.random() * arr.length)];
const SH = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RS = () => Math.random() < 0.5;
// tirage « sans remise » : chaque sous-type revient aussi souvent que les autres
const BAGS = {};
function bag(key, n) { const b = BAGS[key] || (BAGS[key] = []); if (!b.length) b.push(...SH([...Array(n).keys()])); return b.pop(); }
const rnd6 = x => Math.round(x * 1e6) / 1e6;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

// nombre au format français : 4 600 ; 3,5 ; −2
function F(x) {
  x = rnd6(x);
  const neg = x < 0; const s = Math.abs(x).toString();
  let [i, d] = s.split('.');
  if (i.length >= 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
  return (neg ? '−' : '') + i + (d ? ',' + d : '');
}
const FR = x => x < 0 ? '(' + F(x) + ')' : F(x);       // négatif entre parenthèses
const FS = x => x > 0 ? '+' + F(x) : F(x);              // signe toujours écrit
const frac = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const blank = '<span class="trou">……</span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ================= LECTURE DES RÉPONSES =================
function normMath(s) {
  return String(s).trim()
    .replace(/[−–—‒]/g, '-').replace(/[×✕✖·•]/g, '*').replace(/[÷:]/g, '/')
    .replace(/²/g, '^2').replace(/³/g, '^3').replace(/,/g, '.').replace(/\s+/g, '');
}
// nombre : accepte 12 ; -3 ; (-3) ; (- 3) ; −3 ; +4 ; 3,5
function parseNum(s) {
  let t = normMath(s);

const NB = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize'];
const DIZ = { 20: 'vingt', 30: 'trente', 40: 'quarante', 50: 'cinquante', 60: 'soixante' };
function nbLettres(n) {
  if (n < 17) return [NB[n]];
  if (n < 20) return ['dix-' + NB[n - 10]];
  const d = Math.floor(n / 10) * 10, u = n % 10;
  if (u === 0) return [DIZ[d]];
  if (u === 1) return [DIZ[d] + ' et un', DIZ[d] + '-et-un'];
  return [DIZ[d] + '-' + NB[u]];
}
function denLettres(d, plural) {
  if (d === 2) return plural ? ['demis'] : ['demi'];
  if (d === 3) return ['tiers'];
  if (d === 4) return plural ? ['quarts'] : ['quart'];
  const base = { 5: 'cinquième', 9: 'neuvième' }[d] || (NB[d].replace(/e$/, '') + 'ième');
  return [base + (plural ? 's' : '')];
}
const fracLettres = (n, d) => { const r = []; nbLettres(n).forEach(a => denLettres(d, n > 1).forEach(b => r.push(a + ' ' + b))); return r; };
const digitsSum = n => String(n).split('').reduce((a, c) => a + +c, 0);
const divisors = n => [...Array(n).keys()].map(i => i + 1).filter(i => n % i === 0);
const VOC4 = ['multiple', 'diviseur', 'numérateur', 'dénominateur'];
const fracF = f => ({ t: 'frac', mode: 'equiv', ...f });

function divisQuestion(N, k) {
  const ok = N % k === 0;
  const verdict = { t: 'sel', o: ['est', "n'est pas"], a: ok ? 0 : 1 };
  if (k === 3 || k === 9) {
    const s = digitsSum(N);
    return { q: `${F(N)} est-il divisible par ${k} ? Complète la phrase.<div class="phrase">${F(N)} [[0]] divisible par ${k} car la somme de ses chiffres vaut [[1]] et ce nombre [[2]] dans la table de ${k}.</div>`, fields: [verdict, { t: 'num', a: s }, { t: 'sel', o: ['est', "n'est pas"], a: s % k === 0 ? 0 : 1 }], corr: `${String(N).split('').join(' + ')} = ${s}<br>${s} ${s % k === 0 ? 'est' : "n'est pas"} dans la table de ${k}, donc ${F(N)} <b>${ok ? 'est' : "n'est pas"}</b> divisible par ${k}.` };
  }
  const regle = { 2: 'se termine par 0, 2, 4, 6 ou 8', 5: 'se termine par 0 ou 5', 10: 'se termine par 0' }[k];
  return { q: `${F(N)} est-il divisible par ${k} ? Complète la phrase.<div class="phrase">${F(N)} [[0]] divisible par ${k} car son chiffre des unités est [[1]].</div>`, fields: [verdict, { t: 'num', a: N % 10 }], corr: `Un nombre est divisible par ${k} s'il ${regle}.<br>${F(N)} se termine par ${N % 10}, donc il <b>${ok ? 'est' : "n'est pas"}</b> divisible par ${k}.` };
}
function randDivisNumber(k, wantOk) {
  for (let i = 0; i < 500; i++) { const N = R(1000, 999999); if ((N % k === 0) === wantOk) return N; }
  return wantOk ? k * 1234 : k * 1234 + 1;
}

const nz = (a, b) => { let v; do v = R(a, b); while (v === 0); return v; };
// différentes écritures d'un nombre : 4 ; +4 ; (+4) ; (−4) ; −4
function writeNum(v) {
  if (typeof v === 'object') { // fraction {n,d,neg,where}
    const n = v.where === 'den' ? v.n : (v.neg ? '−' : '') + v.n, d = v.where === 'den' ? '−' + v.d : v.d;
    return v.where === 'front' ? (v.neg ? '−' : '') + frac(v.n, v.d) : frac(n, d);
  }
  const s = F(Math.abs(v));
  if (v < 0) return P(['−' + s, '(−' + s + ')']);
  return P([s, '+' + s, '(+' + s + ')', '(' + s + ')']);
}

  const sub = f => f.split(L).join(String(v)), show = f => f.replace(new RegExp(L, 'g'), iL(L));
  let w = v; const prog = [`• ${v}`].concat(steps.map(([o, k]) => { const r = o === '+' ? w + k : o === '-' ? w - k : o === '×' ? w * k : w / k, s = `• ${w} ${o === '-' ? '−' : o} ${k} = ${r}`; w = r; return s; }));
  const lines = f => [sub(f)].concat(stepEval(sub(f))).map((s, i) => (i ? '= ' : '') + s).join('<br>');
  const resBad = rnd6(evalWith(bad, L, v));
  return `Un contre-exemple suffit. Prenons ${L} = <b>${v}</b> :<div class="cex">
    <div><b>Le programme</b><br>${prog.join('<br>')}<br>Résultat : <b>${w}</b></div>
    <div><b>La bonne formule</b> ${show(ok)}<br>${lines(ok)}<br>Résultat : <b>${w}</b></div>
    <div><b>${badLabel}</b> ${show(bad)}<br>${lines(bad)}<br>Résultat : <b>${F(resBad)}</b> ≠ ${w}</div></div>`;
}
function runProgram(steps, v) { for (const [o, k] of steps) { v = o === '+' ? v + k : o === '-' ? v - k : o === '×' ? v * k : v / k; if (v < 0 || !Number.isInteger(v)) return null; } return v; }
function lineOf(steps, L) { let line = L, prio = 3; steps.forEach(([o, k]) => { const p = o === '+' || o === '-' ? 1 : 2; if (p === 2 && prio === 1) line = `(${line})`; line += ` ${o === '-' ? '−' : o} ${k}`; prio = p; }); return line; }

      const rows = [{ d: b, cls: clsRange(b, [[0, a, 'sv-c1']]), label: `${a}/${b}` }, { cls: clsRange(D, [[0, a * k, 'sv-c1']]), label: `= ${a * k}/${D}` }];
      if (plus) rows.push({ cls: clsRange(D, [[0, c, 'sv-c2']]), label: `${c}/${D}` }, { cls: clsRange(D, [[0, a * k, 'sv-c1'], [a * k, r, 'sv-c2']]), label: `total : ${r}/${D}` });
      else rows.push({ cls: clsRange(D, [[0, a * k, 'sv-c1']]), hatch: [...Array(c).keys()].map(i => a * k - c + i), label: `− ${c}/${D} = ${r}/${D}` });
      return { q: `Calcule : <span class="calc">${qA} =</span> [[0]]`, fields: [fracF({ n: r, d: D })],
        corr: `${fracArrowsSVG(a, b, a * k, D, '× ' + k)}${unitBars(D, rows)}${frac(a, b)} = ${frac(a * k, D)}, donc ${first ? `${frac(c, D)} + ${frac(a * k, D)}` : `${frac(a * k, D)} ${plus ? '+' : '−'} ${frac(c, D)}`} = <b>${frac(r, D)}</b>` };
    }
  },
  {
    name: 'Comparer des fractions', gen: () => {
      if (bag('fr-bl-cmp', 3) === 2) { // automatismes : même dénominateur ou même numérateur
        if (RS()) { const d = R(3, 15), a = R(1, 2 * d), b = R(1, 2 * d); const s = a < b ? 0 : a === b ? 1 : 2; return { q: `Compare :<div class="calc">${frac(a, d)} [[0]] ${frac(b, d)}</div>`, fields: [{ t: 'sel', o: ['<', '=', '>'], a: s }], corr: `Même dénominateur : on compare les numérateurs. <b>${frac(a, d)} ${['<', '=', '>'][s]} ${frac(b, d)}</b>` }; }
        let n, d1, d2; do { d1 = R(2, 16); d2 = R(2, 16); n = R(1, Math.min(d1, d2) - 1); } while (d1 === d2 || n < 1);
        const s = d1 > d2 ? 0 : 2, dmin = Math.min(d1, d2), dmax = Math.max(d1, d2);
        const bars = unitBars(dmax, [{ d: d1, cls: clsRange(d1, [[0, n, 'sv-c1']]), label: `${n}/${d1}` }, { d: d2, cls: clsRange(d2, [[0, n, 'sv-c2']]), label: `${n}/${d2}` }]);
        return { q: `Compare :<div class="calc">${frac(n, d1)} [[0]] ${frac(n, d2)}</div>`, fields: [{ t: 'sel', o: ['<', '=', '>'], a: s }],
          corr: `${bars}Les ${denLettres(dmin, true)[0]} sont des parts plus grosses que les ${denLettres(dmax, true)[0]}, donc ${frac(n, dmin)} est plus grand que ${frac(n, dmax)}.<br><b>${frac(n, d1)} ${['<', '=', '>'][s]} ${frac(n, d2)}</b>` };
      }
      const ctx = P([['le zoo A', 'le zoo B', 'animaux', 'sont des fauves', 'Quel zoo a la plus grande proportion de fauves ?'], ['la classe A', 'la classe B', 'élèves', 'sont des filles', 'Quelle classe a la plus grande proportion de filles ?'], ['le sac de Léa', 'le sac de Tom', 'billes', 'sont rouges', 'Quel sac a la plus grande proportion de billes rouges ?']]);
      const lcm = (x, y) => x * y / gcd(x, y);
      let n1, n2, a1, a2; do { [n1, n2] = SH([3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 50]).slice(0, 2); a1 = R(2, n1 - 1); a2 = R(2, n2 - 1); } while (lcm(n1, n2) > 100 || (a1 * lcm(n1, n2) / n1 === a2 * lcm(n1, n2) / n2 && RS()));
      const cap = x => x[0].toUpperCase() + x.slice(1), txt = `Dans ${ctx[0]}, ${a1} ${ctx[2]} sur ${n1} ${ctx[3]}. Dans ${ctx[1]}, ${a2} ${ctx[2]} sur ${n2} ${ctx[3]}.<br>${ctx[4]}`;
      return {
        pre: { q: `${txt}<div class="phrase">Pour comparer ${frac(a1, n1)} et ${frac(a2, n2)}, on cherche d'abord un dénominateur commun.<br>Quel nombre est à la fois un multiple de ${n1} et un multiple de ${n2} ?</div>[[0]]`,
          field: { t: 'num' }, sol: String(lcm(n1, n2)),
          valid: v => !Number.isInteger(v) || v <= 0 ? 'Écris un nombre entier positif.' : v > 1000 ? 'Choisis un multiple commun plus petit (moins de 1 000).'
            : (v % n1 || v % n2) ? `${F(v)} n'est pas à la fois un multiple de ${n1} et de ${n2}. Réessaie : cherche dans la table de ${Math.max(n1, n2)} un nombre qui est aussi dans la table de ${Math.min(n1, n2)}.` : null },
        then: D => {
          const p1 = a1 * D / n1, p2 = a2 * D / n2, s = p1 > p2 ? 0 : p1 < p2 ? 1 : 2;
          return { q: `${txt}<div class="aide">Dénominateur commun choisi : ${D}. Écris les fractions égales.</div><div class="calc">${frac(a1, n1)} = ${frac('[[0]]', D)} &nbsp;&nbsp; ${frac(a2, n2)} = ${frac('[[1]]', D)}</div>`,
            fields: [{ t: 'num', a: p1 }, { t: 'num', a: p2 }, { t: 'choice', o: [cap(ctx[0]), cap(ctx[1]), 'C’est pareil'], a: s }],
            corr: `<div class="pair">${fracArrowsSVG(a1, n1, p1, D, '× ' + D / n1)}${fracArrowsSVG(a2, n2, p2, D, '× ' + D / n2)}</div>${frac(p1, D)} ${['>', '<', '='][s]} ${frac(p2, D)} : <b>${s === 2 ? 'les deux proportions sont égales' : cap(ctx[s]) + ' a la plus grande proportion'}</b>.` };
        }
      };
    }
  },
]);

// ---------- NOMBRES RELATIFS ----------
NOTIONS_RE.push([
  {
    name: 'Distance entre deux points d’une droite graduée', gen: () => {
      let a, b; do { a = R(-9, 9); b = R(-9, 9); } while (a === b || Math.abs(a - b) < 3 || (Math.sign(a) === Math.sign(b) && RS()));
      const [L1, L2] = SH(['A', 'B']), hi = Math.max(a, b), lo = Math.min(a, b), d = hi - lo, l0 = lo - 2, l1 = Math.max(hi + 2, l0 + 10);
      const pins = [{ v: a, l: L1 }, { v: b, l: L2 }];
      return { q: `Calcule la distance ${L1}${L2} en écrivant la soustraction à faire.${lineSVG(l0, l1, 1, pins, { labelStep: l1 - l0 > 12 ? 2 : 1 })}<div class="calc">${L1}${L2} = [[0]] − [[1]] = [[2]]</div><div class="aide">On soustrait la plus petite abscisse à la plus grande.</div>`,
        fields: [{ t: 'num', a: hi }, { t: 'num', a: lo }, { t: 'num', a: d }],
        corr: `${lineSVG(l0, l1, 1, [], { dots: [{ v: a, l: L1 }, { v: b, l: L2 }], brace: [a, b, `${L1}${L2} = ${d}`], labelStep: l1 - l0 > 12 ? 2 : 1 })}${L1}${L2} = ${FR(hi)} − ${FR(lo)} = <b>${d}</b>` };
    }
  },
  {
    name: 'Additionner trois nombres relatifs', gen: () => {
      let v; do v = [nz(-12, 12), nz(-12, 12), nz(-12, 12)]; while (!v.some(x => x > 0) || !v.some(x => x < 0));
      const sp = v.filter(x => x > 0).reduce((a, b) => a + b, 0), sn = v.filter(x => x < 0).reduce((a, b) => a + b, 0), r = sp + sn;
      return { q: `Calcule en regroupant les nombres de même signe :<div class="steps"><div class="calc">${v.map(FR).join(' + ')}</div><div class="calc">= [[0]] + [[1]]</div><div class="calc">= [[2]]</div></div><div class="aide">D'abord la somme des positifs, puis la somme des négatifs.</div>`,
        fields: [{ t: 'num', a: sp }, { t: 'num', a: sn }, { t: 'num', a: r }],
        corr: `${v.map(FR).join(' + ')}<br>= ${v.filter(x => x > 0).map(FR).join(' + ')} + ${v.filter(x => x < 0).map(FR).join(' + ')}<br>= ${F(sp)} + ${FR(sn)}<br>= <b>${FR(r)}</b>` };
    }
  },
  {
    name: 'Soustraire deux nombres entiers relatifs', gen: () => {
      let a, b; do { a = nz(-10, 10); b = nz(-10, 10); } while (Math.abs(a - b) > 15 || (b > 0 && RS()));
      const r = a - b, lo = Math.min(a, r) - 2, hi = Math.max(Math.max(a, r) + 2, lo + 10);
      return { q: `Calcule en ajoutant l'opposé :<div class="calc">${FR(a)} − ${FR(b)} = ${FR(a)} + [[0]] = [[1]]</div><div class="aide">Soustraire un nombre, c'est ajouter son opposé.</div>`,
        fields: [{ t: 'num', a: -b }, { t: 'num', a: r }],
        corr: `L'opposé de ${FR(b)} est ${FR(-b)}.<br>${FR(a)} − ${FR(b)} = ${FR(a)} + ${FR(-b)} = <b>${FR(r)}</b>${lineSVG(lo, hi, 1, [], { jumps: [[a, r]], dots: [{ v: r, l: '' }], labelStep: hi - lo > 18 ? 2 : 1 })}` };
    }
  },
  {
    name: 'Problèmes avec additions et soustractions', gen: () => {
      const t = bag('re-bl-pb', 5);
      let q, a, calc;
      if (t === 0) { const s = R(1, 9), d = s + R(1, 8); q = `Il fait ${s} °C. La température baisse de ${d} °C. Quelle est la nouvelle température ?<br>[[0]] °C`; a = s - d; calc = `${s} − ${d} = ${FR(a)}`; }
      else if (t === 1) { const s = -R(2, 10), d = R(2, 14); q = `Il fait ${F(s)} °C. La température monte de ${d} °C. Quelle est la nouvelle température ?<br>[[0]] °C`; a = s + d; calc = `${FR(s)} + ${d} = ${FR(a)}`; }
      else if (t === 2) { const t1 = -R(1, 9), t2 = R(1, 9); q = `À 6 h, il faisait ${F(t1)} °C. À midi, il fait ${t2} °C. De combien de degrés la température a-t-elle augmenté ?<br>[[0]] °C`; a = t2 - t1; calc = `${t2} − ${FR(t1)} = ${t2} + ${-t1} = ${a}`; }
      else if (t === 3) { const p = R(8, 30), d = R(2, p - 1); q = `Un plongeur est à ${F(-p)} m. Il remonte de ${d} m. À quelle altitude est-il maintenant ?<br>[[0]] m`; a = -p + d; calc = `${FR(-p)} + ${d} = ${FR(a)}`; }
      else { const k = R(1, 4), d = R(2, 9); q = `Un ascenseur part du ${k === 1 ? '1er' : k + 'e'} sous-sol (étage ${F(-k)}) et monte de ${d} étages. À quel étage arrive-t-il ?<br>étage [[0]]`; a = -k + d; calc = `${FR(-k)} + ${d} = ${FR(a)}`; }
      return { q: q.replace('<br>', BROUILLON), fields: [{ t: 'num', a }], corr: `${calc}<br>Réponse : <b>${F(a)}</b>` };
    }
  },
]);

const DB = {
  async get(c, id) { const r = await FB.getDoc(FB.doc(FB.db, c, id)); return r.exists() ? r.data() : null; },
  async set(c, id, d) { await FB.setDoc(FB.doc(FB.db, c, id), d); return true; },
  async merge(c, id, d) { await FB.setDoc(FB.doc(FB.db, c, id), d, { merge: true }); return true; },

  async del(c, id) { await FB.deleteDoc(FB.doc(FB.db, c, id)); return true; },
};
async function safe(fn, msg) {
  try { return await fn(); }
  catch (e) { console.error(e); toast(msg || 'La base de données ne répond pas. Vérifie la connexion internet, puis réessaie.', 'err'); return undefined; }
}

// ---------- progression ----------
const emptyBelt = () => ({ h: ['', '', '', ''], v: false, vd: null, n: 0, k: 0, note: null, man: false });
const getBelt = (prog, d, l) => { const b = prog && prog.belts && prog.belts[keyOf(d, l)]; return b ? Object.assign(emptyBelt(), b) : emptyBelt(); };
const histPct = h => h.length ? Math.round(100 * h.split('').filter(c => c === '1').length / h.length) : 0;
const mastered = h => h.length >= MINQ && histPct(h) >= SEUIL;
const isValid = (prog, d, l) => getBelt(prog, d, l).v;
const isOpen = (prog, d, l) => l === 0 || isValid(prog, d, l - 1);
function currentLevel(prog, d) { for (let l = 0; l < 7; l++) if (!isValid(prog, d, l)) return l; return 7; }

// ---------- petits composants ----------
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; t.setAttribute('role', 'status');
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3500);
}
function modal(html, onclose) {

function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; if (S.onModalClose) { const f = S.onModalClose; S.onModalClose = null; f(); } }
function beltSVG(l, w = 56) {
  const c = LEVELS[l].c, s = l === 0 ? '#8C97A4' : 'rgba(0,0,0,.28)';
  return `<svg class="belt" viewBox="0 0 80 44" width="${w}" aria-hidden="true"><rect x="2" y="12" width="76" height="11" rx="2.5" fill="${c}" stroke="${s}"/><path d="M36,20 L27,41 L35,41 L40,29 L45,41 L53,41 L44,20Z" fill="${c}" stroke="${s}"/><rect x="33" y="8.5" width="14" height="18" rx="3" fill="${c}" stroke="${s}"/></svg>`;
}
// jauge circulaire à 4 secteurs (voir « jauge de progression »)
function ringSVG(belt, size = 150) {
  const cx = size / 2, r = size / 2 - 13, sw = 16, gap = 5;
  const pt = a => [cx + r * Math.cos(a * Math.PI / 180), cx + r * Math.sin(a * Math.PI / 180)];
  const arc = (a0, a1) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };
  let s = '';
  for (let i = 0; i < 4; i++) {
    const a0 = -90 + i * 90 + gap / 2, a1 = a0 + 90 - gap, h = belt.h[i], p = histPct(h);
    s += `<path d="${arc(a0, a1)}" class="ring-track" stroke-width="${sw}" fill="none"/>`;
    if (p > 0) s += `<path d="${arc(a0, a0 + (90 - gap) * Math.max(p, 2) / 100)}" class="${p >= SEUIL ? 'ring-ok' : 'ring-go'}" stroke-width="${sw}" fill="none"/>`;
  }
  const done = belt.h.filter(mastered).length;
  s += belt.v ? `<circle cx="${cx}" cy="${cx}" r="${r - 14}" class="ring-validbg"/><path d="M${cx - r * .42},${cx + 2} l${r * .3},${r * .3} l${r * .55},-${r * .62}" class="ring-check" fill="none" stroke-width="${size / 11}" stroke-linecap="round" stroke-linejoin="round"/>`
    : '';
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${done} notions acquises sur 4">${s}</svg>`;
}
function notionRows(d, l, belt) {
  return belt.h.map((h, i) => {
    const p = histPct(h), ok = mastered(h), shown = h.length >= MINQ;
    return `<li class="nrow ${ok ? 'ok' : ''}"><span class="nname">${esc(notionName(d, l, i))}</span><span class="nbar"><span class="${p >= SEUIL ? 'g' : ''}" style="width:${h.length ? Math.max(p, 2) : 0}%"></span></span><span class="npct">${shown ? p + ' %' : `${h.length}/${MINQ}`}</span></li>`;
  }).join('');
}

// ================= EXERCISEUR =================
function chooseNotion() {
  const b = S.ex.belt, ids = [0, 1, 2, 3], ma = ids.filter(i => mastered(b.h[i])), un = ids.filter(i => !mastered(b.h[i]));
  if (ma.length && un.length) b.k = (b.k || 0) + 1;
  if (ma.length && b.k >= ENTRETIEN) { b.k = 0; return P(ma); }   // question d'entretien
  if (!un.length) return P(ids);
  let pool = un.length > 1 ? un.filter(i => i !== S.ex.last) : un;
  const w = pool.map(i => b.h[i].length < MINQ ? 3 : 1); let t = Math.random() * w.reduce((a, x) => a + x, 0);
  for (let j = 0; j < pool.length; j++) { t -= w[j]; if (t <= 0) return pool[j]; }
  return pool[pool.length - 1];
}
function newQuestion() {
  const ex = S.ex, i = chooseNotion(); ex.last = i; ex.recent[i] = ex.recent[i] || [];
  let q, sig;
  for (let t = 0; t < 12; t++) { q = NOTIONS[ex.d][ex.l][i].gen(); sig = q.q + JSON.stringify(q.fields.map(f => f.a)); if (!ex.recent[i].includes(sig)) break; }
  ex.recent[i].push(sig); if (ex.recent[i].length > 8) ex.recent[i].shift();
  ex.preQ = q.pre ? q : null; if (q.pre) q = { q: q.pre.q, fields: [q.pre.field], corr: '' };
  ex.q = q; ex.notion = i; ex.answered = false; ex.count++;
  renderQuestion();
}
function fieldHTML(f, i) {
  const lab = 'aria-label="Réponse"';
  if (f.t === 'num') return `<input class="f f-num" data-i="${i}" ${lab} autocomplete="off" spellcheck="false" inputmode="text">`;
  if (f.t === 'frac') return `<span class="fr fin"><input class="f f-num" data-i="${i}" data-k="0" aria-label="Numérateur" autocomplete="off"><input class="f f-num" data-i="${i}" data-k="1" aria-label="Dénominateur" autocomplete="off"></span>`;
  if (f.t === 'sel') return `<select class="f" data-i="${i}" ${lab}><option value="">choisir…</option>${f.o.map((o, j) => `<option value="${j}">${o}</option>`).join('')}</select>`;
  if (f.t === 'choice') return `<div class="choices" data-i="${i}" role="radiogroup">${f.o.map((o, j) => `<button type="button" class="opt" role="radio" aria-checked="false" data-v="${j}" onclick="App.pick(this)">${o}</button>`).join('')}</div>`;
  if (f.t === 'multi') return `<div class="choices multi" data-i="${i}">${f.o.map((o, j) => `<button type="button" class="opt" aria-pressed="false" data-v="${j}" onclick="App.toggle(this)">${o}</button>`).join('')}</div>`;
  if (f.t === 'order') return `<div class="order" data-i="${i}"><div class="pool">${f.items.map((v, j) => `<button type="button" class="chip" data-v="${j}" onclick="App.orderMove(this)">${F(v)}</button>`).join('')}</div><div class="seqlabel">Ton rangement :</div><div class="seq" aria-live="polite"></div></div>`;
  return `<input class="f f-wide" data-i="${i}" ${lab} autocomplete="off" spellcheck="false" autocapitalize="off">`;
}
function renderQuestion() {
  const ex = S.ex, q = ex.q, used = new Set();
  let body = q.q.replace(/\[\[(\d)\]\]/g, (m, i) => { used.add(+i); return fieldHTML(q.fields[+i], +i); });
  q.fields.forEach((f, i) => { if (!used.has(i)) body += ['choice', 'multi', 'order'].includes(f.t) ? fieldHTML(f, i) : `<div class="ansline">${fieldHTML(f, i)}</div>`; });
  const types = q.fields.map(f => f.t), needPad = types.some(t => ['poly', 'expr', 'add'].includes(t));
  const keys = types.includes('add') && !types.some(t => t === 'poly' || t === 'expr') ? ['+', '(', ')', '−']
    : ['+', '−', '×', '÷', '(', ')', ...(q.fields.some(f => f.t === 'poly' && /\^/.test(f.a)) ? ['²', '³'] : [])];
  const pad = needPad ? `<div class="keypad" aria-label="Symboles">${keys.map(k => `<button type="button" class="key" onmousedown="event.preventDefault()" onclick="App.insert('${k}')">${k}</button>`).join('')}</div>` : '';
  $('#exCard').innerHTML = `
    <div class="qhead"><span class="qnotion">${esc(notionName(ex.d, ex.l, ex.notion))}</span><span class="qnum">Question ${ex.count}</span></div>
    <form id="qForm" class="qbody" autocomplete="off" onsubmit="event.preventDefault();App.submit()">${body}${pad}
      <div id="qMsg" class="qmsg" aria-live="polite"></div>
      <div class="qactions"><button class="btn primary big" id="qBtn" type="submit">Valider</button></div>
    </form>`;
  S.lastInput = null;
  $$('#exCard input.f').forEach(inp => inp.addEventListener('focus', () => S.lastInput = inp));
  const first = $('#exCard .f, #exCard .opt, #exCard .chip'); if (first) first.focus();
}
function collect() {
  const card = $('#exCard'), q = S.ex.q;
  return q.fields.map((f, i) => {
    if (f.t === 'frac') return [0, 1].map(k => $(`[data-i="${i}"][data-k="${k}"]`, card).value);
    if (f.t === 'choice') { const b = $(`.choices[data-i="${i}"] .opt.on`, card); return b ? b.dataset.v : ''; }
    if (f.t === 'multi') return $$(`.choices[data-i="${i}"] .opt.on`, card).map(b => b.dataset.v);
    if (f.t === 'order') return $$(`.order[data-i="${i}"] .seq .chip`, card).map(b => b.dataset.v);
    return $(`[data-i="${i}"]`, card).value;
  });
}
function answerText(f) {
  switch (f.t) {
    case 'num': return F(f.a); case 'frac': return frac(f.n, f.d);
    case 'sel': case 'choice': return f.o[f.a]; case 'multi': return f.a.map(i => f.o[i]).join(' ; ');
    case 'order': return f.items.slice().sort((a, b) => a - b).map(F).join(' &lt; ');
    case 'text': return esc(f.a[0]); case 'list': return f.a.join(', ');
    case 'add': return f.a.map(FR).join(' + ');
    case 'poly': return esc(f.a).replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/\+/g, ' + ');
    case 'expr': return esc(f.ex || '');
  }
  return '';
}
// correction adaptée : réponse juste (corrOk) ou fausse (corrKo, qui peut utiliser la réponse de l'élève)
function pickCorr(q, ok) {
  const alt = ok ? q.corrOk : q.corrKo; if (!alt) return q.corr;
  return typeof alt === 'function' ? alt(q.fields.map((f, k) => readField(f, collect()[k]).v)) : alt;
}
// colore chaque partie de la réponse : vert si juste, rouge si fausse
function markFields(q, raws, allOk) {
  const card = $('#exCard'), reads = q.fields.map((f, i) => readField(f, raws[i]));
  let st;
  if (q.fieldOk) st = q.fieldOk(reads.map(r => r.v));
  else if (q.check) st = q.fields.map(() => allOk);
  else st = q.fields.map((f, i) => f.t === 'frac' && f.mode === 'exact' ? [reads[i].v[0] === f.n, reads[i].v[1] === f.d] : checkField(f, reads[i]));
  q.fields.forEach((f, i) => {
    const s = st[i];
    if (f.t === 'multi') {
      $$(`.choices[data-i="${i}"] .opt`, card).forEach(o => { const v = +o.dataset.v, on = o.classList.contains('on'), good = f.a.includes(v); o.classList.add(on ? (good ? 'm-ok' : 'm-ko') : good ? 'm-miss' : 'm-no'); });
    } else if (f.t === 'choice') {
      $$(`.choices[data-i="${i}"] .opt`, card).forEach(o => { const v = +o.dataset.v; if (o.classList.contains('on')) o.classList.add(v === f.a ? 'm-ok' : 'm-ko'); else if (v === f.a && !s) o.classList.add('m-miss'); else o.classList.add('m-no'); });
    } else if (f.t === 'order') {
      $(`.order[data-i="${i}"] .seq`, card).classList.add(s ? 'f-ok' : 'f-ko');
    } else if (f.t === 'frac') {
      [0, 1].forEach(k => $(`[data-i="${i}"][data-k="${k}"]`, card).classList.add((Array.isArray(s) ? s[k] : s) ? 'f-ok' : 'f-ko'));
    } else { const el = $(`[data-i="${i}"]`, card); if (el) el.classList.add(s ? 'f-ok' : 'f-ko'); }
  });
}
async function submitAnswer() {
  const ex = S.ex; if (!ex) return;
  if (ex.answered) return nextOrFinish();
  const msg = $('#qMsg');
  if (ex.preQ) { // étape préliminaire : on peut réessayer sans que ce soit compté faux
    const r = readField(ex.preQ.pre.field, collect()[0]), m = r.ok ? ex.preQ.pre.valid(r.v) : r.msg;
    if (m) { msg.className = 'qmsg warn'; msg.textContent = m; const inp = $('#exCard input.f'); if (inp) inp.select(); return; }
    ex.q = ex.preQ.then(r.v); ex.preQ = null; renderQuestion(); return;
  }
  const g = gradeQuestion(ex.q, collect());
  if (g.status === 'invalid') { msg.className = 'qmsg warn'; msg.textContent = g.msg; return; }
  ex.answered = true; const ok = g.status === 'ok', b = ex.belt, i = ex.notion;
  markFields(ex.q, collect(), ok);
  b.h[i] = (b.h[i] + (ok ? '1' : '0')).slice(-FENETRE); b.n = (b.n || 0) + 1;
  $$('#exCard .f, #exCard .opt, #exCard .chip, #exCard .key').forEach(e => e.disabled = true);
  msg.className = 'qmsg ' + (ok ? 'good' : 'bad');
  msg.innerHTML = `<div class="verdict">${ok ? 'Bonne réponse !' : "Ce n'est pas la bonne réponse."}</div><div class="corr">${pickCorr(ex.q, ok)}</div>`;
  const justValidated = !b.v && b.h.every(mastered);
  if (justValidated) { b.v = true; b.vd = Date.now(); }
  $('#qBtn').textContent = justValidated ? 'Voir mon résultat' : 'Question suivante'; $('#qBtn').focus();
  renderSide();
  if (ex.persist) {
    S.prog.belts = S.prog.belts || {}; S.prog.belts[ex.key] = b;
    await safe(() => DB.merge(COL.pr, S.user.id, { belts: { [ex.key]: b }, maj: Date.now() }), "Ta réponse n'a pas pu être enregistrée. Vérifie la connexion internet.");
  }
  ex.justValidated = justValidated;
}
async function nextOrFinish() {

    modal(`<div class="congrats">${beltSVG(ex.l, 150)}<h2>Bravo, tu as réussi la ${beltLabel(ex.d, ex.l)} !</h2><p>Les 4 notions sont acquises avec au moins ${SEUIL} % de réussite.</p><button class="btn primary big" onclick="closeModal()">${ex.persist ? 'Voir ma progression' : 'Terminer le test'}</button></div>`, () => App.quitTraining());

}

  const blocks = [0, 1, 2, 3].map(i => {
    const ex = [0, 1].map(() => { let q = NOTIONS[d][l][i].gen(), pre = '';
      if (q.pre) { pre = `<div>${q.pre.q.replace(/\[\[(\d)\]\]/g, blank)}</div><div class="exa"><b>Étape 1, réponse possible :</b> ${q.pre.sol} (tout multiple commun est accepté)</div><hr>`; q = q.then(+q.pre.sol); }
      let body = q.q.replace(/\[\[(\d)\]\]/g, blank); return `<div class="exq">${pre}<div>${body}</div><div class="exa"><b>Réponse attendue :</b> ${q.fields.map(answerText).join(' | ')}<div class="corr">${q.corr}</div></div></div>`; }).join('');
    return `<h3>${i + 1}. ${esc(notionName(d, l, i))}</h3>${ex}`;
  }).join('');
  modal(`<h2>Ceinture ${LEVELS[l].n.toLowerCase()} : ${DOM_NAME[d]}</h2><p class="hint">Deux exemples tirés au hasard par notion. Rouvre cette fenêtre pour en voir d'autres.</p>${blocks}<div class="btnrow end"><button class="btn" onclick="App.examples('${d}',${l})">Autres exemples</button><button class="btn primary" onclick="closeModal()">Fermer</button></div>`);
}
// ----- liens -----
function tabLiens() {
  const opt = DOMS.map(d => `<option value="${d}">${DOM_NAME[d]}</option>`).join(''), optL = LEVELS.map((L, l) => `<option value="${l}">${L.n}</option>`).join('');
  const list = DOMS.map(d => LEVELS.map((L, l) => { const ls = S.cfg.links[keyOf(d, l)] || []; if (!ls.length) return ''; return `<li>${beltSVG(l, 34)}<b>${DOM_NAME[d]}, ${L.n.toLowerCase()}</b><ul>${ls.map((k, j) => `<li><a href="${esc(k.u)}" target="_blank" rel="noopener">${esc(k.t)}</a> <button class="btn small danger" onclick="App.delLink('${d}',${l},${j})">Supprimer</button></li>`).join('')}</ul></li>`; }).join('')).join('');
  $('#tabBody').innerHTML = `<h2>Liens vers les leçons et vidéos</h2><p class="hint">Les élèves voient les liens des ceintures validées et de la ceinture en cours, même quand les exercices sont fermés.</p>
    <form class="row-form" onsubmit="event.preventDefault();App.addLink()">
      <label>Ceinture<select id="lkD">${opt}</select></label><label>Couleur<select id="lkL">${optL}</select></label>
      <label class="grow">Titre<input id="lkT" required placeholder="Leçon : priorités opératoires"></label><label class="grow">Adresse<input id="lkU" required placeholder="https://…"></label>
      <button class="btn primary" type="submit">Ajouter le lien</button></form>
    ${list ? `<ul class="linklist">${list}</ul>` : '<p class="empty">Aucun lien pour l\'instant.</p>'}`;
}
// ----- activation -----
function tabActivation() {
  const ill = S.eleves.filter(e => e.illimite).sort(byName);
  $('#tabBody').innerHTML = `<h2>Accès des élèves aux exercices</h2>
    <div class="switchbox ${S.cfg.active ? 'on' : ''}"><p class="big">${S.cfg.active ? 'Les exercices sont ouverts pour toute la classe.' : 'Les exercices sont fermés.'}</p>
    <button class="btn big ${S.cfg.active ? 'danger' : 'primary'}" onclick="App.setActive(${!S.cfg.active})">${S.cfg.active ? 'Fermer les exercices' : 'Ouvrir les exercices'}</button></div>
    <p class="hint">Quand les exercices sont fermés, les élèves voient seulement leur progression et les liens. Un élève en train de s'entraîner est arrêté au bout de quelques questions (sa progression reste enregistrée).</p>
    <h3>Élèves avec accès illimité</h3>${ill.length ? `<p>${ill.map(e => esc(e.prenom + ' ' + (e.nom || ''))).join(', ')}</p>` : '<p class="empty">Aucun. Coche « Accès illimité » dans l\'onglet Élèves.</p>'}`;
}
// ----- paramètres -----
function tabParams() {
  $('#tabBody').innerHTML = `<h2>Mot de passe professeur</h2>
    <form class="stack narrowform" onsubmit="event.preventDefault();App.changePwd()">
      <label for="pw0">Mot de passe actuel</label><input id="pw0" type="text" required autocomplete="off">
      <label for="pw1">Nouveau mot de passe</label><input id="pw1" type="text" required autocomplete="off">
      <label for="pw2">Nouveau mot de passe, une seconde fois</label><input id="pw2" type="text" required autocomplete="off">
      <button class="btn primary" type="submit">Changer le mot de passe</button></form>`;
}

// ================= ACTIONS =================
const App = {
  togglePwd(id, btn) { const i = $('#' + id); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; btn.textContent = show ? 'Masquer' : 'Afficher'; btn.setAttribute('aria-label', (show ? 'Masquer' : 'Afficher') + ' le mot de passe'); },
  async studentLogin() {
    const id = $('#lgName').value, pwd = $('#lgPwd').value.trim(); const e = S.eleves.find(x => x.id === id);
    if (!e) return toast('Choisis ton prénom dans la liste.');
    if (String(e.mdp).trim() !== pwd) { toast('Mot de passe incorrect. Vérifie chaque caractère.', 'err'); $('#lgPwd').select(); return; }
    const [prog, cfg] = await Promise.all([safe(() => DB.get(COL.pr, id)), safe(() => DB.get(COL.cfg, 'main'))]);
    if (prog === undefined) return;
    if (cfg) S.cfg = Object.assign(S.cfg, cfg);
    S.user = e; S.prog = prog || { belts: {} }; renderHome();
  },
  async refreshHome() { const cfg = await safe(() => DB.get(COL.cfg, 'main')); if (cfg) S.cfg = Object.assign(S.cfg, cfg); renderHome(); if (!canTrain()) toast('Les exercices sont toujours fermés.'); },
  logout() { renderLogin(); },
  async startTraining(d, l) {
    const cfg = await safe(() => DB.get(COL.cfg, 'main')); if (cfg) S.cfg = Object.assign(S.cfg, cfg);
    if (!canTrain()) { toast('Les exercices sont fermés pour le moment.'); return renderHome(); }
    if (!isOpen(S.prog, d, l)) return;
    startExerciser(d, l, getBelt(S.prog, d, l), true);
  },
  quitTraining() { const persist = S.ex && S.ex.persist; S.ex = null; if (persist) renderHome(); else renderProf('exos'); },
  submit() { submitAnswer(); },
  pick(b) { $$('.opt', b.parentNode).forEach(o => { o.classList.remove('on'); o.setAttribute('aria-checked', 'false'); }); b.classList.add('on'); b.setAttribute('aria-checked', 'true'); },
  toggle(b) { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); },
  orderMove(b) { const o = b.closest('.order'); (b.parentNode.classList.contains('pool') ? $('.seq', o) : $('.pool', o)).appendChild(b); },
  insert(k) {
    // case visée : celle où se trouve le curseur, sinon la dernière utilisée dans CETTE question, sinon la première case de texte
    const ok = el => el && !el.disabled && el.matches && el.matches('#exCard input.f') && document.contains(el);
    const i = [document.activeElement, S.lastInput, $('#exCard input.f-wide:not(:disabled)'), $('#exCard input.f:not(:disabled)')].find(ok); if (!i) return; const s = i.selectionStart ?? i.value.length, e = i.selectionEnd ?? i.value.length; i.value = i.value.slice(0, s) + k + i.value.slice(e); i.focus(); i.setSelectionRange(s + k.length, s + k.length); },
  // professeur
  profLogin() {
    modal(`<h2>Espace professeur</h2><form class="stack" onsubmit="event.preventDefault();App.profCheck()"><label for="pfPwd">Mot de passe</label><div class="pwd"><input id="pfPwd" type="password" autocomplete="off" required><button type="button" class="eye" onclick="App.togglePwd('pfPwd',this)">Afficher</button></div><div class="btnrow end"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" type="submit">Entrer</button></div></form>`);
  },
  async profCheck() {
    const cfg = await safe(() => DB.get(COL.cfg, 'main')); if (cfg) S.cfg = Object.assign(S.cfg, cfg);
    if ($('#pfPwd').value !== S.cfg.profPwd) { toast('Mot de passe incorrect.', 'err'); return; }
    closeModal(); S.prof = true; S.user = null; S.eleves = (await safe(() => DB.all(COL.el))) || S.eleves; renderProf('eleves');
  },
  tab(k) { renderProf(k); },
  genPwd() { const w = ['soleil', 'lune', 'chat', 'loup', 'pomme', 'vague', 'nuage', 'tigre', 'olive', 'cerise', 'renard', 'pirate', 'fusee', 'koala', 'ananas', 'flocon']; $('#neMdp').value = P(w) + R(10, 99); },
  async addEleve() {
    const e = { prenom: $('#nePrenom').value.trim(), nom: $('#neNom').value.trim(), mdp: $('#neMdp').value.trim(), illimite: $('#neIll').checked };
    if (!e.prenom || !e.mdp) return toast('Le prénom et le mot de passe sont obligatoires.');
    const id = newId(); if (await safe(() => DB.set(COL.el, id, e)) === undefined) return;
    S.eleves.push({ id, ...e }); toast(`${e.prenom} est ajouté(e).`); tabEleves(); $('#nePrenom').focus();
  },
  async editEleve(id, k, v) { const e = S.eleves.find(x => x.id === id); if (typeof v === 'string') v = v.trim(); if ((k === 'prenom' || k === 'mdp') && !v) { toast('Ce champ ne peut pas être vide.'); return tabEleves(); } if (await safe(() => DB.merge(COL.el, id, { [k]: v })) === undefined) return; e[k] = v; toast('Modification enregistrée.'); },
  async delEleve(id) {
    const e = S.eleves.find(x => x.id === id); if (!confirm(`Supprimer ${e.prenom} ${e.nom || ''} et toute sa progression ?`)) return;
    await safe(async () => { await DB.del(COL.el, id); await DB.del(COL.pr, id); }); S.eleves = S.eleves.filter(x => x.id !== id); tabEleves();
  },
  beltFile(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#beltIn').value = r.result.replace(/^\ufeff/, ''); }; r.readAsText(f, 'utf-8'); },
  async importBelts() {
    const nrm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[-\s]+/g, ' ').trim();
    const DOMK = { 'calcul litteral': 'cl', 'cl': 'cl', 'fractions': 'fr', 'fraction': 'fr', 'fr': 'fr', 'nombres relatifs': 're', 'relatifs': 're', 're': 're' };
    const lines = $('#beltIn').value.replace(/^\ufeff/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(/[;\t]/).map(x => x.trim().replace(/^"|"$/g, '')));
    const todo = {}, errs = []; let n = 0;
    for (const c of lines) {
      if (/^pr[ée]nom$/i.test(c[0])) continue;
      const e = S.eleves.find(x => nrm(x.prenom) === nrm(c[0]) && nrm(x.nom) === nrm(c[1])), d = DOMK[nrm(c[2])], l = LEVELS.findIndex(L => nrm(L.n) === nrm(c[3]));
      if (!e) { errs.push(`${c[0]} ${c[1]} : élève introuvable`); continue; }
      if (!d || l < 0) { errs.push(`${c.join(' ; ')} : domaine ou couleur non reconnu`); continue; }
      const p = todo[e.id] || (todo[e.id] = { belts: {} }), b = emptyBelt();
      Object.assign(b, { v: true, vd: Date.now(), man: true, note: (c[4] || '').replace('.', ',') || null }); p.belts[keyOf(d, l)] = b; n++;
    }
    if (!n) { $('#beltMsg').textContent = errs.length ? 'Rien n\'a été importé. ' + errs.join(' ; ') : 'Colle d\'abord les lignes dans la zone de texte.'; return; }
    const ok = await safe(async () => { for (const id in todo) await DB.merge(COL.pr, id, todo[id]); return true; }); if (!ok) return;
    toast(`${n} ceinture(s) validée(s) importée(s) pour ${Object.keys(todo).length} élève(s).`);
    await tabNotes(); if (errs.length) { $('details.import').open = true; $('#beltMsg').textContent = `Lignes non importées : ${errs.join(' ; ')}`; }
  },
  csvFile(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#csvIn').value = r.result.replace(/^\ufeff/, ''); }; r.readAsText(f, 'utf-8'); },
  async importEleves(replace) {
    const lines = $('#csvIn').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const list = lines.map(l => l.split(/[;\t,]/).map(x => x.trim().replace(/^"|"$/g, ''))).filter(c => c[0] && !/^pr[ée]nom$/i.test(c[0]));
    const bad = list.filter(c => !c[2]); if (!list.length) return toast('Colle d\'abord la liste dans la zone de texte.');
    if (bad.length) return toast(`${bad.length} ligne(s) sans mot de passe : ${bad.map(c => c[0]).join(', ')}.`, 'err');
    if (replace && !confirm(`Remplacer toute la liste ? Les ${S.eleves.length} élèves actuels et leur progression seront supprimés.`)) return;
    const ok = await safe(async () => {
      if (replace) for (const e of S.eleves) { await DB.del(COL.el, e.id); await DB.del(COL.pr, e.id); }
      if (replace) S.eleves = [];
      for (const c of list) { const e = { prenom: c[0], nom: c[1] || '', mdp: c[2], illimite: /^(oui|o|1|x|true|vrai)$/i.test(c[3] || '') }; const id = newId(); await DB.set(COL.el, id, e); S.eleves.push({ id, ...e }); }
      return true;
    });
    if (ok) { toast(`${list.length} élève(s) importé(s).`); tabEleves(); }
  },
  exportEleves() { download('eleves-ceintures.csv', 'Prénom;Nom;MotDePasse;AccèsIllimité\n' + S.eleves.slice().sort(byName).map(e => [e.prenom, e.nom || '', e.mdp, e.illimite ? 'oui' : 'non'].map(csvCell).join(';')).join('\n')); },
  cellDetail,
  async setValid(id, d, l, v) {
    const p = S.allProg[id] || { belts: {} }; const b = getBelt(p, d, l); const note = ($('#nt-' + l).value || '').trim();
    b.v = v; b.vd = v ? Date.now() : null; b.man = v; b.note = note || null;
    if (await safe(() => DB.merge(COL.pr, id, { belts: { [keyOf(d, l)]: b } })) === undefined) return;
    p.belts = p.belts || {}; p.belts[keyOf(d, l)] = b; S.allProg[id] = p; cellDetail(id, d); S.onModalClose = () => tabNotes();
  },
  async resetBelt(id, d, l) {
    if (!confirm("Effacer l'entraînement de cette ceinture ? Les pourcentages repartent de zéro.")) return;
    const p = S.allProg[id] || { belts: {} }; const b = getBelt(p, d, l); Object.assign(b, { h: ['', '', '', ''], n: 0, k: 0 });
    if (await safe(() => DB.merge(COL.pr, id, { belts: { [keyOf(d, l)]: b } })) === undefined) return;
    p.belts = p.belts || {}; p.belts[keyOf(d, l)] = b; S.allProg[id] = p; cellDetail(id, d); S.onModalClose = () => tabNotes();
  },
  exportNotes() {
    const head = ['Prénom', 'Nom']; DOMS.forEach(d => head.push(`${DOM_NAME[d]} : dernière validée`, `${DOM_NAME[d]} : en cours`, `${DOM_NAME[d]} : notions (%)`, `${DOM_NAME[d]} : notes papier`));
    const rows = S.eleves.slice().sort(byName).map(e => {
      const p = S.allProg[e.id], r = [e.prenom, e.nom || ''];
      DOMS.forEach(d => {
        const cur = currentLevel(p, d), b = cur < 7 ? getBelt(p, d, cur) : null;
        r.push(cur ? LEVELS[cur - 1].n : 'aucune', cur < 7 ? LEVELS[cur].n : 'terminé', b ? b.h.map(h => h.length >= MINQ ? histPct(h) : '-').join(' / ') : '',
          LEVELS.map((L, l) => { const x = getBelt(p, d, l); return x.note ? `${L.n} ${x.note}/20` : ''; }).filter(Boolean).join(', '));
      });
      return r.map(csvCell).join(';');
    });
    download('resultats-ceintures.csv', head.join(';') + '\n' + rows.join('\n'));
  },
  async renameNotion(d, l, i, v) {
    const k = keyOf(d, l); const arr = (S.cfg.notionNames[k] || [0, 1, 2, 3].map(j => NOTIONS[d][l][j].name)).slice(); arr[i] = v.trim() || NOTIONS[d][l][i].name;
    if (await safe(() => DB.merge(COL.cfg, 'main', { notionNames: { [k]: arr } })) === undefined) return;
    S.cfg.notionNames[k] = arr; toast('Nom de la notion enregistré.');
  },
  examples,
  testBelt(d, l) { startExerciser(d, l, emptyBelt(), false); },
  async addLink() {
    const d = $('#lkD').value, l = +$('#lkL').value, t = $('#lkT').value.trim(); let u = $('#lkU').value.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    const k = keyOf(d, l), arr = (S.cfg.links[k] || []).concat([{ t, u }]);
    if (await safe(() => DB.merge(COL.cfg, 'main', { links: { [k]: arr } })) === undefined) return;
    S.cfg.links[k] = arr; toast('Lien ajouté.'); tabLiens(); $('#lkD').value = d; $('#lkL').value = l;
  },
  async delLink(d, l, j) { const k = keyOf(d, l), arr = (S.cfg.links[k] || []).filter((x, i) => i !== j); if (await safe(() => DB.merge(COL.cfg, 'main', { links: { [k]: arr } })) === undefined) return; S.cfg.links[k] = arr; tabLiens(); },
  async setActive(v) { if (await safe(() => DB.merge(COL.cfg, 'main', { active: v })) === undefined) return; S.cfg.active = v; toast(v ? 'Exercices ouverts.' : 'Exercices fermés.'); renderProf('activation'); },
  async changePwd() {
    const a = $('#pw0').value, b = $('#pw1').value.trim(), c = $('#pw2').value.trim();
    if (a !== S.cfg.profPwd) return toast('Le mot de passe actuel est incorrect.', 'err');
    if (b.length < 4) return toast('Choisis un mot de passe d\'au moins 4 caractères.');
    if (b !== c) return toast('Les deux nouveaux mots de passe sont différents.', 'err');
    if (await safe(() => DB.merge(COL.cfg, 'main', { profPwd: b })) === undefined) return; S.cfg.profPwd = b; toast('Mot de passe changé.'); tabParams();
  },
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === 'Enter' && S.ex && S.ex.answered && $('#modal').hidden && !e.target.closest('textarea')) { e.preventDefault(); submitAnswer(); }
